<main class="fm"><div class="c"><h2>Masuk sebagai siswa</h2><label class="f">Nama lengkap<input id="sn" autocomplete="off"></label><label class="f">Kelas<input id="sk" autocomplete="off"></label><label class="f">Kode ujian<input id="sc" autocomplete="off"></label><button class="p" style="width:100%" onclick="mulai()">Mulai ujian</button></div>
<div class="c" style="margin:0"><h2>Guru dan pengawas</h2><label class="f">PIN</label><div class="pw"><input id="gp" type="password" aria-label="PIN" onkeydown="event.key=='Enter'&&masuk()">${EYE}</div><button style="width:100%" onclick="masuk()">Buka panel guru</button></div></main></div>`;
async function masuk(){ld();const p=$('#gp').value;if(!SB){if(p===D.pin){V='guru';render()}else toast('PIN salah');return}
try{const r=await rpc('wg_pull',{p_pin:p});if(!r)return toast('PIN salah');GP=p;gapply(r);V='guru';render();gpoll()}catch(e){toast(/terlalu banyak/.test(e.message)?'Terlalu banyak percobaan PIN. Tunggu 5 menit.':'Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.')}}
const guru=()=>`<div class="tb"><div class="r">${LG(34)}<div><b>WIN GUARD</b><div class="mt">Panel guru</div></div></div><button onclick="gout()">Keluar</button></div>${D.pin=='1234'?'<div class="c" style="border-color:var(--rd)">PIN masih bawaan. Ganti PIN di tab Pengaturan.</div>':''}
<div id="nt">${ntB()}</div><div class="r tabs" style="margin-bottom:16px">${[['soal','Bank soal'],['ujian','Pengaturan'],['lap','Laporan']].map(([k,n])=>`<button class="${TB==k?'on':''}" onclick="TB='${k}';render()">${n}${k=='lap'&&unr()?` <span class="bd x">${unr()}</span>`:''}</button>`).join('')}</div>${TB=='soal'?tSoal():TB=='ujian'?tUjian():tLap()}`;
const tSoal=()=>`<div class="c"><h2>Impor dari Word atau Excel</h2><input type="file" accept=".docx,.xlsx,.xls,.csv" onchange="imp(this.files[0]);this.value=''"><div class="mt" style="margin:-6px 0 10px">Unggah berkas .xlsx, .xls, .csv, atau .docx yang sudah diisi sesuai template. Soal akan ditambahkan ke daftar soal.</div><div class="r"><button onclick="tpl()">Unduh template Excel</button><button onclick="tplW()">Unduh template Word</button></div>
<details style="margin-top:12px"><summary>Format dokumen Word</summary><pre class="mt" style="white-space:pre-wrap">[PG] Ibu kota Indonesia adalah ...
A. Surabaya
B. Jakarta
Kunci: B
Bobot: 1

[PGK] Pilih bilangan prima.
A. 2
B. 4
C. 7
Kunci: A,C

[BS] Tentukan benar atau salah.
A. Bumi itu bulat
B. Matahari adalah planet
Kunci: B,S

[JODOH] Jodohkan negara dan ibu kota.
A. Jepang = Tokyo
B. Mesir = Kairo

[ISIAN] 7 + 5 = ...
Kunci: 12

[URAIAN] Jelaskan proses fotosintesis.
Kunci: klorofil, cahaya, glukosa</pre><div class="mt">Excel: kolom Tipe, Soal, A sampai E, Kunci, Bobot (baris pertama = judul kolom).</div><div class="mt" style="margin-top:6px">Rumus dan simbol: tulis di antara tanda $, misalnya $&#92;frac{1}{2}$, $&#92;ce{H2O}$, atau ketik simbol Unicode langsung. Di Word, Insert > Equation juga terbaca otomatis. Lihat "Panduan simbol lengkap" di form Tambah soal manual.</div></details></div>
<div class="c"><h2>Tambah soal manual</h2><div class="g"><div>Tipe<select id="mt" onchange="$('#hn').textContent=HINT[this.value]">${Object.entries(T).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div>Bobot<input id="mw" type="number" value="1" min="0" step="0.5"></div></div>Soal<textarea id="mq" rows="3" oninput="$('#mpv').innerHTML=M(this.value)"></textarea><div class="mt">Rumus: tulis di antara tanda dolar, contoh $&#92;frac{y_2-y_1}{x_2-x_1}$, $x^2+&#92;sqrt{9}$, $30^&#92;circ$, $&#92;ce{H2O}$. Pratinjau:</div><div id="mpv" style="min-height:24px;margin-bottom:6px"></div>Opsi (satu per baris)<textarea id="mo" rows="4"></textarea>Kunci<input id="mk"><div class="mt" id="hn">${HINT.PG}</div>${palT()}<button class="p" onclick="tambah()" style="margin-top:10px">Tambah soal</button></div>
